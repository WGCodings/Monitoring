# Beszel agent for ANOTHER Pi / machine (not pi-alpha, which runs its agent
# in the main stack). Copy this folder to that machine, then:
#   1. In the hub (monitor.wgcodings.com): Add system -> name, host = this
#      machine's LAN IP or hostname, port 45876. Copy the public key.
#   2. Put it in .env next to this file:  BESZEL_AGENT_KEY=ssh-ed25519 ...
#   3. docker compose up -d
# The hub connects to this agent over the LAN on port 45876.

services:
  beszel-agent:
    image: henrygd/beszel-agent:latest
    container_name: beszel-agent
    restart: unless-stopped
    network_mode: host
    environment:
      LISTEN: 45876
      KEY: ${BESZEL_AGENT_KEY:?set BESZEL_AGENT_KEY in .env}
    volumes:
      - ./beszel_agent_data:/var/lib/beszel-agent
      - /var/run/docker.sock:/var/run/docker.sock:ro
