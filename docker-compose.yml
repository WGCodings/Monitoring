# Infrastructure stack for pi-alpha:
#   - Caddy:   the one reverse proxy + HTTPS for every app on the Pi
#              (sites in caddy/sites/, apps reached over the shared `edge`
#              network). Also writes the access log GoAccess reads.
#   - Beszel:  lightweight monitoring. `beszel` is the hub (web UI +
#              history), `beszel-agent` collects this Pi's stats. Future
#              Pi's only run an agent (see agent/docker-compose.yml).
#   - GoAccess: turns Caddy's access log into a visitor report
#              (monitor.wgcodings.com/traffic).
# See README.md for setup.

services:
  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3
    environment:
      # Password for monitor.wgcodings.com/traffic (see .env.example)
      TRAFFIC_USER: ${TRAFFIC_USER:-admin}
      TRAFFIC_PASS_HASH: ${TRAFFIC_PASS_HASH:?set TRAFFIC_PASS_HASH in .env}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/sites:/etc/caddy/sites:ro
      - ./logs/caddy:/var/log/caddy          # access log, read by GoAccess
      - ./traffic:/srv/traffic:ro            # GoAccess report
      - caddy_data:/data                     # certificates, keep this volume
      - caddy_config:/config
    # default: beszel hub. edge: every app stack on the Pi.
    networks: [default, edge]

  beszel:
    # Hub: web UI, login, history (SQLite), alerts. ~20-30 MB RAM.
    image: henrygd/beszel:latest
    container_name: beszel
    restart: unless-stopped
    environment:
      APP_URL: https://monitor.wgcodings.com
    volumes:
      - ./beszel_data:/beszel_data
      - ./beszel_socket:/beszel_socket       # talks to the local agent
    networks: [default]

  beszel-agent:
    # Collects this Pi's CPU, RAM, disk, temperature, network, and per-
    # container stats (straight from Docker, no cAdvisor). ~10 MB RAM.
    # Host network so it sees the Pi's real network interfaces.
    image: henrygd/beszel-agent:latest
    container_name: beszel-agent
    restart: unless-stopped
    network_mode: host
    environment:
      # The hub reaches this agent through a unix socket (no open port).
      LISTEN: /beszel_socket/beszel.sock
      # Public key shown in the hub's "Add system" dialog (see README)
      KEY: ${BESZEL_AGENT_KEY:?set BESZEL_AGENT_KEY in .env}
    volumes:
      - ./beszel_socket:/beszel_socket
      - ./beszel_agent_data:/var/lib/beszel-agent
      - /var/run/docker.sock:/var/run/docker.sock:ro

  goaccess:
    # Rebuilds the visitor report from Caddy's access log every 5 minutes.
    # Sleeps in between, so it uses almost no CPU/RAM. No network needed.
    image: allinurl/goaccess:latest
    container_name: goaccess
    restart: unless-stopped
    network_mode: none
    entrypoint: ["/bin/sh", "/run.sh"]
    volumes:
      - ./logs/caddy:/var/log/caddy:ro
      - ./traffic:/report
      - ./goaccess_db:/goaccess_db
      - ./goaccess/run.sh:/run.sh:ro

volumes:
  caddy_data:
  caddy_config:

networks:
  edge:
    external: true
